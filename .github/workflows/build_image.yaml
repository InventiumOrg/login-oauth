name: Build and Deploy to GKE

on:
  push:
    branches: ["*"]
env:
  REPOSITORY: 205098647215.dkr.ecr.ap-southeast-1.amazonaws.com/inventium/login-oauth
  IMAGE: login-oauth
  VERSION: 0.0.1

jobs:
  continuous-integration:
    name: Setup, Build, Publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ap-southeast-1
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      - name: Login to AWS ECR
        run: |-
          aws ecr get-login-password --region ap-southeast-1 | docker login --username AWS --password-stdin 205098647215.dkr.ecr.ap-southeast-1.amazonaws.com

      - name: Get the Git commit hash
        run: |-
          echo "sha_short=$(git rev-parse --short "$GITHUB_SHA")" >> "$GITHUB_ENV"

      - name: Build
        run: |-
          docker build --tag "$REPOSITORY:$VERSION-$sha_short" . --build-arg SERVICE_NAME=$IMAGE

      - name: Publish
        run: |-
          docker push "$REPOSITORY:$VERSION"
